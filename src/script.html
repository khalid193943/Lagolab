    },
    function(loc){ var ss = $('site'), wv = $('s4').clientHeight, dist = Math.max(0, ss.offsetHeight - wv); ss.style.transform = 'translateY(' + (-dist * ease(clamp01((loc - 0.05) / 0.65))) + 'px)'; $('toast').classList.toggle('on', loc > 0.66); $('pnotif').classList.toggle('on', loc > 0.6); var ps = $('psite'), pv = ps.parentNode.clientHeight; $('psite').style.transform = 'translateY(' + (-Math.max(0, ps.offsetHeight - pv) * ease(clamp01((loc - 0.1) / 0.6))) + 'px)'; },
    function(){},

    [0.06, 0.32, 0.7, 0.84].forEach(function(t, i){ nfs[i].classList.toggle('on', loc > t); });
  }
  var STEPF;
  /* ---------- Tous les métiers : le sélecteur tourne tout seul ---------- */

  var mtSec = $('metiers'), mtTrack = $('mtTrack'), MC = Array.prototype.slice.call(document.querySelectorAll('#mtTrack .mc2')), mtCur = -1, mtCW = 0, mtGap = 0;

  /* Apparitions douces, comparatif, fleurs du pied de page */

  (function(){

    setTimeout(function(){ ready = true; }, 1600);
    function tick(now){
      if (!pre.parentNode) return;

  })();
  /* ---------- Curseur et boutons magnétiques ---------- */

  if (fine && !RM) {

  /* ---------- L'horloge de la journée : de 7 h à 23 h au fil de la page ---------- */
  var dcEl = $('dayclock'), dcT = $('dcTime'), dcL = $('dcLab');

  /* ---------- Le fond suit la journée : le bleu fonce doucement, sans coupure ---------- */
  var DAY = [['mani','#E6F1FE','#E3EFFD'],['wi','#E3EFFD','#DFEDFD'],['story','#DFEDFD','#C8DFFB'],['svc','#C8DFFB','#B7D4F9'],['metiers','#B7D4F9','#A6C9F6'],['showcase','#A6C9F6','#9CC2F5'],['sim','#9CC2F5','#4577D0'],['trust','#4577D0','#2F5FB8'],['gen','#2A56B0','#1F4592'],['moment','#1F4592','#1C4088'],['guides','#1C4088','#183A7E'],['vis','#183A7E','#0E214E']], DA = [];

  (function(){

  (function(){ var r = document.getElementById('lgRow'); if (!r) return; var items = Array.prototype.slice.call(r.children); var W = window.innerWidth * 1.4, w = r.scrollWidth || 1, n = Math.max(1, Math.ceil(W / w)); for (var k = 1; k < n; k++) items.forEach(function(el){ r.appendChild(el.cloneNode(true)); }); Array.prototype.slice.call(r.children).forEach(function(el){ var c = el.cloneNode(true); c.setAttribute('aria-hidden', 'true'); r.appendChild(c); }); })();

  /* ---------- Boucle ---------- */
  function frame(now){

})();
