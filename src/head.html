<!--LOCALFONTS-->
<style>
:root{
  --bg:#072021; --bg-2:#182E32; --green:#64F662; --sage:#CEE0CA; --ink:#04140F; --text:#DDE6E6; --muted:#35514A;
  --sea:#031416; --land:#0F3336; --u:1px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#072021; --bg-2:#182E32; --green:#64F662; --sage:#CEE0CA; --ink:#04140F; --text:#DDE6E6; } }
:root[data-theme="dark"]{ --bg:#072021; --bg-2:#182E32; --green:#64F662; --sage:#CEE0CA; --ink:#04140F; --text:#DDE6E6; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--text);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

.hero{height:100vh;overflow:hidden;background:var(--bg);opacity:0;transition:opacity .5s}
.hero.ready{opacity:1}

.nav{position:absolute;left:0;right:0;top:0;z-index:8;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nav .logo{justify-self:start}.nav .tools{justify-self:end}
.logo{display:flex;align-items:center;gap:calc(9 * var(--u));color:#fff}
.word{font-family:Sora,sans-serif;font-weight:600;letter-spacing:-.055em;line-height:1;display:flex}
.i{position:relative}
.i::after{content:"";position:absolute;left:50%;top:-.02em;width:.19em;height:.19em;margin-left:-.095em;border-radius:50%;background:var(--green)}
.links{display:flex;align-items:center;font-weight:500;color:var(--text)}
.links a{transition:color .2s}
.links a:hover{color:var(--green)}
.links .open{color:var(--green);display:flex;align-items:center;gap:calc(8 * var(--u))}
.links .open span{font-weight:400}
.tools{display:flex;align-items:center}
.sq{display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--bg-2);color:var(--text);border:0;cursor:pointer;transition:background .2s}
.sq:hover{background:#21393D}
.cta{display:flex;align-items:center;gap:calc(3 * var(--u));color:var(--ink)}
.cta .arw,.cta .lbl{display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--green);transition:filter .2s}
.cta .lbl{font-weight:500;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cta:hover .arw,.cta:hover .lbl{filter:brightness(1.08)}
.cta .arw svg{transition:transform .25s}
.cta:hover .arw svg{transform:translateX(2px)}
.menu-btn{background:var(--green);display:none}
.menu-btn:hover{background:var(--green)}

.head{position:absolute;left:50%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;text-align:center}
.eyebrow{margin:0;color:var(--green);letter-spacing:.08em;text-transform:uppercase}
.head h1{margin:0;color:#F4F8F6;font-family:Sora,"Instrument Sans",system-ui,sans-serif;font-weight:500;letter-spacing:-.05em;line-height:.98}
.head h1 .ln{display:block;width:max-content;margin:0 auto;white-space:nowrap}
.head h1 .ti{position:relative}
.head h1 .ti::after{content:"i";position:absolute;left:0;top:0;line-height:normal;color:var(--green);clip-path:inset(0 0 var(--ti-clip,100%) 0)}
.head .cta{display:none}

.band{position:absolute;left:0;right:0;bottom:0;overflow:hidden;background:var(--sea);touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
.band.drag{cursor:grabbing}
#map{position:absolute;left:0;top:0;display:block}
.tile{position:absolute;border-radius:3px;box-shadow:0 0 0 1px rgba(4,22,23,.9);overflow:hidden;pointer-events:none}
.glass{position:absolute;inset:0;border-radius:3px;background:rgba(206,224,202,.07);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);animation:glass 10s ease-in-out infinite both}
@keyframes glass{0%,40%,100%{opacity:1}52%,88%{opacity:0}}
.chip{position:absolute;z-index:7;pointer-events:none;padding:calc(6 * var(--u)) calc(10 * var(--u));border-radius:3px;background:rgba(4,24,25,.9);box-shadow:0 0 0 1px rgba(100,246,98,.32),0 10px 30px -10px rgba(0,0,0,.6);font-size:calc(11 * var(--u));line-height:1.35;color:var(--text);white-space:nowrap;opacity:0;transition:opacity .45s,transform .45s cubic-bezier(.16,1,.3,1)}
.chip.on{opacity:1}
.chip b{display:block;font-weight:500;color:var(--green);font-size:calc(9.5 * var(--u));letter-spacing:.06em;text-transform:uppercase}
.card{position:absolute;z-index:5;border:0;border-radius:3px;background:var(--sage);color:var(--ink);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:calc(6 * var(--u));cursor:pointer;animation:pop .9s cubic-bezier(.16,1,.3,1) both;transition:box-shadow .5s}
.card.lime{background:var(--green)}
.card .plus{position:absolute;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.card .num{font-family:"JetBrains Mono",monospace;color:var(--muted);letter-spacing:.04em}
.card.lime .num{color:#1E5A2A}
.card .t{font-family:Sora,sans-serif;font-weight:500;line-height:1.12;letter-spacing:-.02em}
.card .d{display:none;line-height:1.35}
.card[aria-expanded="true"]{z-index:6;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.card[aria-expanded="true"] .plus{transform:rotate(45deg)}
.card[aria-expanded="true"] .t{display:none}
.card[aria-expanded="true"] .d{display:block}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.fade{position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none;background:linear-gradient(to bottom,rgba(7,32,33,0),#072021)}
.co{transition:opacity .6s}
.controls{position:absolute;z-index:8;display:flex;align-items:center;cursor:default}
.controls .sq{color:var(--green)}
.controls .hint{color:#9FB0AE;margin-right:calc(8 * var(--u));white-space:nowrap}
.in{animation:rise 1.1s cubic-bezier(.16,1,.3,1) both}
.in2{animation:rise 1.1s cubic-bezier(.16,1,.3,1) .15s both}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}

.hero[data-mode="M"] .links,.hero[data-mode="M"] .tools .cta,.hero[data-mode="M"] .controls .hint{display:none}
.hero[data-mode="M"] .menu-btn{display:flex}
.hero[data-mode="M"] .nav{grid-template-columns:1fr auto}
.hero[data-mode="M"] .head .cta{display:flex}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);padding:calc(96px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;clip-path:inset(0 0 100% 0);transition:clip-path .55s cubic-bezier(.76,0,.24,1);visibility:hidden}
.sheet.open{clip-path:inset(0 0 0 0);visibility:visible}
.sheet a.big{font-family:Sora,sans-serif;font-size:34px;letter-spacing:-.03em;padding:14px 0;border-bottom:1px solid rgba(221,230,230,.1);display:flex;justify-content:space-between;align-items:baseline}
.sheet a.big small{font-family:"JetBrains Mono",monospace;font-size:12px;color:#8FA5A2}
.sheet .cta{margin-top:auto}
.sheet .cta .arw{width:52px;height:52px}.sheet .cta .lbl{height:52px;flex:1;font-family:"JetBrains Mono",monospace;font-size:12.5px}
.close{position:absolute;right:20px;top:calc(14px + env(safe-area-inset-top,0px));width:44px;height:44px;background:var(--green)}
.close:hover{background:var(--green)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Sous-titre du hero ---------- */
.head .sub{margin:0;color:rgba(221,230,230,.72);font-size:calc(17 * var(--u));line-height:1.5;max-width:calc(560 * var(--u))}
.hero[data-mode="M"] .head .sub{font-size:calc(14.5 * var(--u));max-width:calc(320 * var(--u))}

/* ---------- Transition : lever du jour sur El Jadida ---------- */
#intro{position:relative;z-index:6}
.hero{position:sticky}
.dawn{position:absolute;left:0;right:0;z-index:9;pointer-events:none;opacity:1}
.dawn-pin{position:absolute;z-index:10;pointer-events:none;opacity:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:calc(14 * var(--u))}
.dawn-pin .dot{width:calc(16 * var(--u));height:calc(16 * var(--u));border-radius:50%;background:var(--green);box-shadow:0 0 0 calc(6 * var(--u)) rgba(100,246,98,.25),0 0 0 calc(14 * var(--u)) rgba(100,246,98,.1)}
.dawn-pin .lbl{font-size:calc(12 * var(--u));letter-spacing:.06em;text-transform:uppercase;color:#0B3B2E;white-space:nowrap;opacity:0;transition:opacity .5s}


/* ---------- Section 2 : le parcours d'un client ---------- */
.light{--paper:#F2F6F1;--ink2:#072021;--grey:#5B706C;--soft:#98AAA5;--line:#DCE6DF;--deep:#178A4A;background:var(--paper);color:var(--ink2)}
#why{position:relative}
.why-stage{position:sticky;top:0;overflow:hidden}
.grad{background:linear-gradient(90deg,#0B6B5C 0%,#178A4A 55%,#3E9A22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.pill{display:inline-flex;align-items:center;gap:calc(9 * var(--u));padding:calc(5 * var(--u)) calc(14 * var(--u)) calc(5 * var(--u)) calc(5 * var(--u));border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line),0 calc(8 * var(--u)) calc(24 * var(--u)) calc(-14 * var(--u)) rgba(7,32,33,.25);font-size:calc(13 * var(--u));font-weight:500;color:var(--ink2);white-space:nowrap}
.pill .ic{width:calc(24 * var(--u));height:calc(24 * var(--u));border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.pill .ic svg{width:calc(12 * var(--u));height:calc(12 * var(--u))}

.s1{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(18 * var(--u));background:radial-gradient(ellipse at 50% 40%,#fff 0,#F7F9F7 70%)}
.s1 .kick{font-family:"JetBrains Mono",monospace;font-size:calc(11 * var(--u));letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.sbar{width:76%;height:calc(62 * var(--u));border-radius:999px;background:#fff;box-shadow:0 0 0 1px #E1E8E3,0 calc(18 * var(--u)) calc(40 * var(--u)) calc(-20 * var(--u)) rgba(7,32,33,.3);display:flex;align-items:center;gap:calc(14 * var(--u));padding:0 calc(24 * var(--u));font-size:calc(19 * var(--u));color:var(--ink2)}
.sbar svg{width:calc(20 * var(--u));height:calc(20 * var(--u));flex:none}
.caret{display:inline-block;width:2px;height:1.1em;background:#1FA34A;margin-left:1px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sugg{width:76%;display:flex;flex-direction:column;padding:calc(8 * var(--u)) 0;border-radius:calc(18 * var(--u));background:#fff;box-shadow:0 0 0 1px #E6ECE7;opacity:0;transform:translateY(-6px);transition:opacity .4s,transform .4s}
.sugg.on{opacity:1;transform:none}
.sugg div{display:flex;align-items:center;gap:calc(14 * var(--u));padding:calc(10 * var(--u)) calc(24 * var(--u));font-size:calc(15 * var(--u));color:var(--grey)}
.sugg div:first-child{background:#F1F6F2;color:var(--ink2)}
.sugg svg{width:calc(15 * var(--u));height:calc(15 * var(--u));flex:none;opacity:.6}

.s2{position:absolute;inset:0;display:grid;grid-template-columns:36% 1fr}
.res{display:flex;flex-direction:column;gap:calc(10 * var(--u));padding:calc(20 * var(--u));background:#fff;box-shadow:1px 0 0 #E6ECE7}
.res .q{font-size:calc(12.5 * var(--u));color:var(--soft);padding:0 calc(4 * var(--u)) calc(6 * var(--u))}
.row{display:flex;gap:calc(12 * var(--u));padding:calc(13 * var(--u));border-radius:calc(14 * var(--u));opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}
.row.on{opacity:1;transform:none}
.row.me{background:#EFF8EE;box-shadow:0 0 0 1px #CDEBCB}
.row .pin{width:calc(30 * var(--u));height:calc(30 * var(--u));flex:none;border-radius:50%;background:#E3E9E5;display:flex;align-items:center;justify-content:center}
.row.me .pin{background:var(--green)}
.row .pin svg{width:calc(13 * var(--u));height:calc(13 * var(--u))}
.row b{display:block;font-weight:500;font-size:calc(14.5 * var(--u));color:var(--ink2)}
.row small{display:block;font-size:calc(12 * var(--u));color:var(--grey);margin-top:calc(2 * var(--u))}
.stars{display:flex;gap:2px;margin-top:calc(6 * var(--u))}
.stars svg{width:calc(11 * var(--u));height:calc(11 * var(--u))}
.sk{display:block;height:calc(9 * var(--u));border-radius:9px;background:#E6ECE8}
.mapv{position:relative;overflow:hidden}
.mapv svg.city{position:absolute;inset:0;width:100%;height:100%}
.mpin{position:absolute;transform:translate(-50%,-100%) scale(.4);opacity:0;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.mpin.on{transform:translate(-50%,-100%) scale(1);opacity:1}
.mpin svg{width:calc(24 * var(--u));height:calc(30 * var(--u));display:block}
.mpin.me svg{width:calc(36 * var(--u));height:calc(45 * var(--u))}
.mpin.me::after{content:"";position:absolute;left:50%;bottom:calc(-6 * var(--u));width:calc(44 * var(--u));height:calc(13 * var(--u));margin-left:calc(-22 * var(--u));border-radius:50%;background:rgba(100,246,98,.35);animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.5);opacity:1}to{transform:scale(1.8);opacity:0}}
.mtag{position:absolute;transform:translate(-50%,calc(-100% - 54 * var(--u)));padding:calc(6 * var(--u)) calc(11 * var(--u));border-radius:calc(9 * var(--u));background:var(--ink2);color:#fff;font-size:calc(12 * var(--u));white-space:nowrap;opacity:0;transition:opacity .4s}
.mtag.on{opacity:1}

.s3{position:absolute;inset:0}
.s3 .mapv{position:absolute;inset:0;filter:saturate(.6);opacity:.5}
.fiche{position:absolute;right:calc(22 * var(--u));top:calc(22 * var(--u));bottom:calc(22 * var(--u));width:50%;border-radius:calc(18 * var(--u));background:#fff;box-shadow:0 0 0 1px #E1E8E3,0 calc(28 * var(--u)) calc(60 * var(--u)) calc(-26 * var(--u)) rgba(7,32,33,.4);overflow:hidden;display:flex;flex-direction:column;transform:translateX(28px);opacity:0;transition:transform .7s cubic-bezier(.16,1,.3,1),opacity .5s}
.s3.on .fiche{transform:none;opacity:1}
.fiche img{width:100%;height:46%;object-fit:cover;display:block}
.fiche .body{padding:calc(16 * var(--u)) calc(18 * var(--u));display:flex;flex-direction:column;gap:calc(4 * var(--u))}
.fiche h4{margin:0;font-family:Sora,sans-serif;font-weight:500;font-size:calc(18 * var(--u));letter-spacing:-.02em}
.fiche .meta{font-size:calc(12.5 * var(--u));color:var(--grey)}
.fiche .open{font-size:calc(12.5 * var(--u));color:var(--deep);margin-top:calc(2 * var(--u))}
.acts{display:flex;gap:calc(8 * var(--u));margin-top:calc(12 * var(--u))}
.acts span{flex:1;height:calc(38 * var(--u));border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:calc(12.5 * var(--u));box-shadow:0 0 0 1px #DCE6DF;color:var(--ink2)}
.acts .go{background:var(--green);box-shadow:none;font-weight:500;position:relative}
.acts .go.hit::after{content:"";position:absolute;inset:-6px;border-radius:999px;box-shadow:0 0 0 2px #1FA34A;animation:hit .7s ease-out}
@keyframes hit{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.15)}}
.cursor{position:absolute;width:calc(22 * var(--u));height:calc(22 * var(--u));z-index:4;transition:opacity .3s;pointer-events:none}

.s4{position:absolute;inset:0;overflow:hidden;background:#0E2346}
.site-scroll{position:absolute;left:0;right:0;top:0;will-change:transform}
.site-scroll img.site{display:block;width:100%;height:auto}
.site-more{background:#0E2346;padding:calc(34 * var(--u)) calc(30 * var(--u)) calc(60 * var(--u));display:flex;flex-direction:column;align-items:flex-start;gap:calc(8 * var(--u))}
.sm-k{font-family:"JetBrains Mono",monospace;font-size:calc(10.5 * var(--u));letter-spacing:.14em;text-transform:uppercase;color:#F2B233}
.sm-t{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:calc(24 * var(--u));color:#fff}
.sm-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(12 * var(--u));width:100%;margin-top:calc(16 * var(--u))}
.sm-cards div{border-radius:calc(10 * var(--u));background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.1);padding:calc(14 * var(--u));display:flex;flex-direction:column;gap:calc(7 * var(--u))}
.sm-cards i{width:calc(26 * var(--u));height:calc(26 * var(--u));border-radius:50%;background:#F2B233}
.sm-cards b{font-weight:500;font-size:calc(13.5 * var(--u));color:#fff;margin-top:calc(4 * var(--u))}
.sm-cards span{display:block;height:calc(6 * var(--u));border-radius:6px;background:rgba(255,255,255,.14)}
.sm-cards span+span{width:60%}
.sm-btn{margin-top:calc(18 * var(--u));padding:calc(9 * var(--u)) calc(16 * var(--u));background:#F2B233;color:#0E2346;font-size:calc(12.5 * var(--u));font-weight:500;border-radius:2px}
.toast{position:absolute;right:calc(20 * var(--u));bottom:calc(20 * var(--u));z-index:3;display:flex;align-items:center;gap:calc(12 * var(--u));padding:calc(12 * var(--u)) calc(18 * var(--u)) calc(12 * var(--u)) calc(12 * var(--u));border-radius:calc(14 * var(--u));background:#fff;box-shadow:0 calc(20 * var(--u)) calc(44 * var(--u)) calc(-16 * var(--u)) rgba(7,32,33,.5);font-size:calc(13.5 * var(--u));color:var(--ink2);opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s}
.toast.on{opacity:1;transform:none}
.ok{width:calc(30 * var(--u));height:calc(30 * var(--u));flex:none;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.ok svg{width:calc(13 * var(--u));height:calc(13 * var(--u))}
.toast small{display:block;color:var(--grey);font-size:calc(11.5 * var(--u))}

/* Scène 5 : de vrais sites, pour chaque métier */
.s5{position:absolute;inset:0;background:#E9EEEA;overflow:hidden}
.sites{position:absolute;left:0;right:0;top:0;padding:calc(20 * var(--u));display:flex;flex-direction:column;gap:calc(20 * var(--u));will-change:transform}
.ms{position:relative;flex:none;border-radius:calc(16 * var(--u));overflow:hidden;background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px rgba(7,32,33,.08),0 calc(26 * var(--u)) calc(50 * var(--u)) calc(-30 * var(--u)) rgba(7,32,33,.45);transform-origin:50% 50%;transition:transform .6s cubic-bezier(.16,1,.3,1),filter .6s}
.ms.dim{transform:scale(.965);filter:saturate(.7) brightness(.97)}
.ms-nav{position:absolute;left:0;right:0;top:0;height:14%;display:flex;align-items:center;gap:calc(18 * var(--u));padding:0 5%;font-size:calc(11 * var(--u));z-index:2}
.ms-logo{display:flex;align-items:center;gap:calc(8 * var(--u));font-weight:600;font-size:calc(13 * var(--u));margin-right:auto;white-space:nowrap}
.ms-logo i{width:calc(24 * var(--u));height:calc(24 * var(--u));border-radius:50%;background:var(--ac);color:var(--bg);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:"Playfair Display",Georgia,serif;font-size:calc(11 * var(--u))}

.s-bars{width:calc(360 * var(--u))!important;bottom:calc(34 * var(--u))!important;gap:calc(6 * var(--u))!important}

[data-mode="M"] .s-q,[data-mode="M"] .s-count em{display:none!important}

/* ================= Moins de fonds blancs ================= */
.slide{background:transparent!important;box-shadow:none!important}
.slide .night{border-radius:calc(22 * var(--u))!important}
.st4 > div{background:transparent!important;box-shadow:none!important;padding-left:0!important;padding-right:0!important}
.sp-f{background:transparent!important;box-shadow:none!important}

/* ================= Le ciel de jour : nuages et bleu ciel ================= */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sky-f{position:absolute;width:0;height:0}
.cl{position:absolute;will-change:transform;animation:cloudDrift var(--dd,60s) ease-in-out infinite alternate}
.cl .sh,.cl .wh{position:absolute;inset:0}
.cl .sh{filter:url(#skyF2);transform:translateY(14%);opacity:.95;mix-blend-mode:multiply}
.cl .wh{filter:url(#skyF1)}
.cl p{position:absolute;margin:0;border-radius:50%}
.cl .wh p{background:radial-gradient(circle at 42% 32%,#fff 0%,rgba(255,255,255,.96) 22%,rgba(236,244,255,.78) 44%,rgba(214,230,252,.45) 58%,rgba(255,255,255,0) 71%)}
.cl .sh p{background:radial-gradient(circle at 50% 70%,rgba(70,120,195,.75) 0%,rgba(110,155,215,.4) 40%,rgba(150,185,230,0) 70%)}
@keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(var(--dx,40px))}}
[data-mode="M"] .sky{--cs:.55;-webkit-mask-image:linear-gradient(180deg,transparent 0%,transparent 48%,rgba(0,0,0,.6) 66%,#000 82%);mask-image:linear-gradient(180deg,transparent 0%,transparent 48%,rgba(0,0,0,.6) 66%,#000 82%)}
/* Accueil : ciel de jour */

.hero .hbg{display:none!important}
.hero .nav,.hero .head,.hero .hstage{z-index:3}

.hero .ti::after{color:#0B2F6B!important}
.hero .sub{color:rgba(255,255,255,.88)!important}
.hero .eyebrow{background:rgba(255,255,255,.18)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)!important;color:#fff!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero .eyebrow .live,.hero .eyebrow .live::after{background:#fff!important}
.hero .cta .arw,.hero .cta .lbl{background:#fff!important;color:#072021!important}

.hero .nav .links a,.hero .nav .word{color:#fff!important}
.hero .nav .cta .arw,.hero .nav .cta .lbl{background:#fff!important;color:#072021!important}
.hero .nav .lang{background:rgba(255,255,255,.18)!important;color:#fff!important}
/* Pages intérieures : même ciel */
.phero{background:linear-gradient(180deg,#1B6BDB 0%,#2F84EC 40%,#5AA4F4 78%,#8CC4F8 100%)!important}
.phero::before{display:none!important}
.phero > *:not(.sky):not(.pollen){position:relative;z-index:2}

.phero h1 .grad{background:linear-gradient(180deg,#fff 10%,rgba(255,255,255,.45) 95%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}

.phero .cta .arw,.phero .cta .lbl{background:#fff!important;color:#072021!important}

/* Pied de page : la nuit, la lune et les étoiles */
.nstars{position:absolute;inset:0;pointer-events:none;z-index:0}
.nstars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.2;animation:tw3 4s ease-in-out infinite}
.nstars i.b{width:3px;height:3px;box-shadow:0 0 6px rgba(255,255,255,.8)}
@keyframes tw3{0%,100%{opacity:.15}50%{opacity:.95}}
.fmoon{position:absolute;right:9%;top:calc(70 * var(--u));width:calc(90 * var(--u));height:calc(90 * var(--u));border-radius:50%;z-index:0;background:radial-gradient(circle at 38% 36%,#FFFFFF 0%,#E8EEF8 45%,#C9D4E6 100%);box-shadow:0 0 calc(60 * var(--u)) rgba(220,232,255,.45),0 0 calc(160 * var(--u)) rgba(150,190,255,.25);animation:moonF 12s ease-in-out infinite alternate}

/* ================= Rien n'est coupé : titres et logo en entier ================= */
.grad,.phero h1 .grad,.foot h2 .g,.hero .head h1 .ln + .ln{padding:.04em .16em .2em .06em!important;margin:-.04em -.16em -.2em -.06em!important;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.head h1 .ln{padding-bottom:.08em}

/* ================= Une journée en bleu : le ciel fonce doucement jusqu'à la nuit ================= */

.rest{box-shadow:none!important;border-radius:0!important}

/* l'horloge de la journée */
.dayclock{position:fixed;left:calc(22 * var(--u));bottom:calc(22 * var(--u));z-index:45;display:flex;align-items:center;gap:calc(10 * var(--u));height:calc(44 * var(--u));padding:0 calc(16 * var(--u)) 0 calc(8 * var(--u));border-radius:999px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(7,32,33,.08),0 calc(14 * var(--u)) calc(30 * var(--u)) calc(-16 * var(--u)) rgba(7,32,33,.4);color:#072021;font-size:calc(12.5 * var(--u));opacity:0;transform:translateY(20px);transition:opacity .5s,transform .6s cubic-bezier(.16,1,.3,1),background .6s,color .6s}
